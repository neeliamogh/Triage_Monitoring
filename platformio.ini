[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Source files are modular C++, and .env + web assets are embedded at build time.
extra_scripts = pre:scripts/prebuild.py

lib_deps =
    olikraus/U8g2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit MLX90614 Library

build_flags =
    -D CORE_DEBUG_LEVEL=0
